  </div>
  <script>
    const appState = {
      allMessages: [],
      filteredMessages: [],
      currentIndex: 0,
      searchQuery: "",
      normalizedTerms: [],
      filters: {
        sender: "ALL",
        dateFrom: null,
        dateTo: null,
        mediaOnly: false
      },
      isSearchActive: false,
      lastScrollTop: 0,
      currentView: "chat", // "chat" | "media"
      mediaIndex: [],
      filteredMedia: [],
      galleryCurrentIndex: 0,
      galleryCategory: "all",
      gallerySearchQuery: "",
      dirHandle: null,
      mediaFileMap: new Map()
    };

    function resolveMediaUrl(fileName) {
      if (appState.mediaFileMap && appState.mediaFileMap.has(fileName)) {
        return appState.mediaFileMap.get(fileName);
      }
      return encodeURI(fileName);
    }

    const lightboxState = {
      isOpen: false,
      currentIndex: 0,
      mediaList: [],
      zoomLevel: 1.0,
      panOffset: { x: 0, y: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      audioInstance: null,
      audioPlaybackSpeed: 1.0
    };

    const chunkSize = 150;
    const chatContainer = document.getElementById("chat-container");
    const statusSpan = document.getElementById("status");
    const loadingIndicator = document.getElementById("loading-indicator");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const senderFilter = document.getElementById("senderFilter");
    const dateFromInput = document.getElementById("dateFrom");
    const dateToInput = document.getElementById("dateTo");
    const mediaOnlyCheckbox = document.getElementById("mediaOnly");
    const resetFiltersBtn = document.getElementById("resetFiltersBtn");
    const searchStats = document.getElementById("searchStats");
    const scrollToBottomBtn = document.getElementById("scrollToBottomBtn");

    // View switch elements
    const viewTabChat = document.getElementById("view-tab-chat");
    const viewTabMedia = document.getElementById("view-tab-media");
    const totalMediaCountSpan = document.getElementById("total-media-count");
    const searchPanel = document.querySelector(".search-panel");

    // Gallery elements
    const mediaGalleryContainer = document.getElementById("media-gallery-container");
    const galleryGrid = document.getElementById("gallery-grid");
    const gallerySentinel = document.getElementById("gallery-sentinel");
    const galleryLoadingIndicator = document.getElementById("gallery-loading-indicator");
    const gallerySearchInput = document.getElementById("gallery-search-input");
    const galleryTabs = document.querySelectorAll(".gallery-tab");
    const countAllSpan = document.getElementById("count-all");
    const countPhotoVideoSpan = document.getElementById("count-photo-video");
    const countVoiceSpan = document.getElementById("count-voice");
    const countDocSpan = document.getElementById("count-doc");

    // Lightbox elements
    const lightboxModal = document.getElementById("lightbox-modal");
    const lightboxOverlay = document.getElementById("lightbox-overlay");
    const lightboxTitle = document.getElementById("lightbox-title");
    const lightboxSender = document.getElementById("lightbox-sender");
    const lightboxCounter = document.getElementById("lightbox-counter");
    const lightboxBtnJump = document.getElementById("lightbox-btn-jump");
    const lightboxBtnDownload = document.getElementById("lightbox-btn-download");
    const lightboxBtnClose = document.getElementById("lightbox-btn-close");
    const lightboxBtnPrev = document.getElementById("lightbox-btn-prev");
    const lightboxBtnNext = document.getElementById("lightbox-btn-next");
    const lightboxViewport = document.getElementById("lightbox-viewport");
    const lightboxCaption = document.getElementById("lightbox-caption");

    // Context Menu elements
    const messageContextMenu = document.getElementById("messageContextMenu");
    const contextMenuGoHistory = document.getElementById("contextMenuGoHistory");
    let contextMenuTargetMessageId = null;

    function parseDateToTimestamp(dateStr, timeStr) {
      if (!dateStr) return 0;
      const cleanDate = dateStr.replace(/\//g, '.');
      const parts = cleanDate.split('.');
      if (parts.length !== 3) return 0;

      let day = parseInt(parts[0], 10);
      let month = parseInt(parts[1], 10) - 1;
      let year = parseInt(parts[2], 10);
      if (isNaN(day) || isNaN(month) || isNaN(year)) return 0;
      if (year < 100) year += 2000;

      let hours = 0;
      let minutes = 0;
      if (timeStr) {
        const timeMatch = timeStr.match(/^(\d{1,2}):(\d{2})/);
        if (timeMatch) {
          hours = parseInt(timeMatch[1], 10);
          minutes = parseInt(timeMatch[2], 10);
          if (/pm/i.test(timeStr) && hours < 12) hours += 12;
          if (/am/i.test(timeStr) && hours === 12) hours = 0;
        }
      }

      const parsedDate = new Date(year, month, day, hours, minutes);
      return parsedDate.getTime() || 0;
    }

    function createMediaBlobUrl(file) {
      if (!file) return "";
      const ext = file.name.split('.').pop().toLowerCase();
      // Browsers often detect .opus as "" or application/octet-stream when read from local disk.
      // Wrapping in a typed Blob with audio/ogg or audio/webm allows native browser Opus decoding.
      if (ext === 'opus') {
        const mime = MediaSource.isTypeSupported('audio/webm; codecs=opus') ? 'audio/webm; codecs=opus' : 'audio/ogg; codecs=opus';
        const typedBlob = file.slice(0, file.size, mime);
        return URL.createObjectURL(typedBlob);
      }
      return URL.createObjectURL(file);
    }
    function classifyMediaType(ext) {
      const cleanExt = (ext || "").toLowerCase().replace(/^\./, "");
      if (["jpg", "jpeg", "png", "gif", "webp", "mp4", "webm", "mov"].includes(cleanExt)) {
        return "photo_video";
      }
      if (["opus", "ogg", "mp3", "m4a", "wav", "aac"].includes(cleanExt)) {
        return "voice";
      }
      return "document";
    }

    function extractAttachment(text) {
      // Supports WhatsApp export languages: English, Russian, Spanish, German, French, Portuguese, Italian, Turkish, etc.
      const attachRegex = /[\u200e\u200f]?([^\s()<>]+\.[A-Za-z0-9]{2,5})\s*\((?:file attached|файл добавлен|archivo adjunto|angehängt|fichier joint|arquivo anexado|allegato|dosya eklendi|[^\)]*attached[^\)]*|[^\)]*добавлен[^\)]*)[^\)]*\)/i;
      const match = text.match(attachRegex);
      if (!match) {
        return {
          attachment: null,
          cleanText: text.replace(/[\u200e\u200f]/g, "").trim()
        };
      }

      const fileName = match[1];
      const ext = fileName.split('.').pop().toLowerCase();
      const mediaExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'webm', 'mov', 'opus', 'ogg', 'mp3', 'm4a', 'wav', 'aac'];
      const isMedia = mediaExts.includes(ext);
      const cleanText = text.replace(match[0], "").replace(/[\u200e\u200f]/g, "").trim();

      return {
        attachment: {
          fileName,
          extension: ext,
          isMedia
        },
        cleanText
      };
    }

    function buildMediaIndex(messages) {
      const mediaIndex = [];
      for (let i = 0; i < messages.length; i++) {
        const msg = messages[i];
        if (!msg.attachment) continue;

        const fileName = msg.attachment.fileName;
        const ext = msg.attachment.extension;
        const fileType = classifyMediaType(ext);
        const isUser = (msg.sender && (msg.sender.toLowerCase() === "you" || msg.sender.toLowerCase() === "me"));
        const { cleanText } = extractAttachment(msg.text);

        const mediaId = mediaIndex.length;
        const item = {
          id: mediaId,
          messageId: msg.id,
          fileName,
          fileUrl: resolveMediaUrl(fileName),
          fileType,
          extension: ext,
          sender: msg.sender || "System",
          isUser,
          date: msg.date,
          time: msg.time,
          caption: cleanText
        };

        mediaIndex.push(item);
        msg.mediaIndexId = mediaId;
      }
      return mediaIndex;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlightText(rawText, terms) {
      if (!rawText) return "";
      if (!terms || terms.length === 0) {
        return escapeHtml(rawText);
      }

      const validTerms = terms
        .map(t => t.trim())
        .filter(t => t.length > 0);

      if (validTerms.length === 0) {
        return escapeHtml(rawText);
      }

      const escapedTerms = validTerms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const pattern = new RegExp(`(${escapedTerms.join('|')})`, 'gi');
      const safeText = escapeHtml(rawText);
      return safeText.replace(pattern, '<mark class="search-highlight">$1</mark>');
    }

    const globalVoiceController = {
      audio: new Audio(),
      activeBtn: null,
      activeProgress: null,
      activeTime: null,
      currentUrl: null,
      init() {
        this.audio.addEventListener("timeupdate", () => {
          if (!this.audio.duration || isNaN(this.audio.duration)) return;
          const pct = Math.min(100, Math.max(0, (this.audio.currentTime / this.audio.duration) * 100));
          if (this.activeProgress) {
            this.activeProgress.style.width = `${pct}%`;
          }
          if (this.activeTime) {
            this.activeTime.textContent = this.formatTime(this.audio.currentTime);
          }
        });
        this.audio.addEventListener("ended", () => {
          this.stop();
        });
        this.audio.addEventListener("pause", () => {
          if (this.activeBtn) {
            this.activeBtn.textContent = "▶";
          }
        });
        this.audio.addEventListener("play", () => {
          if (this.activeBtn) {
            this.activeBtn.textContent = "⏸";
          }
        });
        this.audio.addEventListener("error", () => {
          this.stop();
        });
      },
      formatTime(sec) {
        if (!sec || isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      },
      play(url, btn, progress, timeEl) {
        if (this.currentUrl === url && !this.audio.paused) {
          this.pause();
          return;
        }
        if (this.currentUrl === url && this.audio.paused && this.audio.src) {
          this.activeBtn = btn;
          this.activeProgress = progress;
          this.activeTime = timeEl;
          this.audio.play().catch(() => this.stop());
          return;
        }
        this.stop();
        this.currentUrl = url;
        this.activeBtn = btn;
        this.activeProgress = progress;
        this.activeTime = timeEl;
        this.audio.src = url;
        this.audio.play().catch(() => this.stop());
      },
      pause() {
        this.audio.pause();
        if (this.activeBtn) {
          this.activeBtn.textContent = "▶";
        }
      },
      stop() {
        if (!this.audio.paused) {
          this.audio.pause();
        }
        if (this.activeBtn) {
          this.activeBtn.textContent = "▶";
        }
        if (this.activeProgress) {
          this.activeProgress.style.width = "0%";
        }
        if (this.activeTime) {
          this.activeTime.textContent = "0:00";
        }
        this.activeBtn = null;
        this.activeProgress = null;
        this.activeTime = null;
        this.currentUrl = null;
      }
    };
    globalVoiceController.init();

    function renderAttachment(fileName, terms, mediaIndexId) {
      const ext = fileName.split('.').pop().toLowerCase();
      const mediaUrl = resolveMediaUrl(fileName);
      const mediaType = classifyMediaType(ext);

      const openModalHandler = (e) => {
        if (typeof mediaIndexId === 'number' && appState.mediaIndex[mediaIndexId]) {
          e.preventDefault();
          openLightbox(mediaIndexId, null);
        }
      };

      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
        const img = document.createElement("img");
        img.className = "media-preview";
        img.src = mediaUrl;
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = fileName;
        img.style.cursor = "pointer";
        img.onclick = openModalHandler;
        img.onerror = () => {
          img.style.display = 'none';
          const err = document.createElement('div');
          err.className = 'missing-placeholder';
          err.innerHTML = `<span>⚠️ File not found</span><small>${escapeHtml(fileName)}</small>`;
          img.parentNode?.insertBefore(err, img);
        };
        return img;
      }

      if (['mp4', 'webm', 'mov'].includes(ext)) {
        const card = document.createElement("div");
        card.className = "video-preview-card";
        card.onclick = openModalHandler;

        const video = document.createElement("video");
        video.src = mediaUrl;
        video.preload = "none";
        video.muted = true;
        video.playsInline = true;
        card.appendChild(video);

        const overlay = document.createElement("div");
        overlay.className = "video-preview-overlay";
        overlay.innerHTML = `<div class="video-play-badge">▶ Video</div>`;
        card.appendChild(overlay);

        video.onerror = () => {
          card.onclick = null;
          card.innerHTML = `<div class="missing-placeholder"><span>⚠️ Video unavailable</span><small>${escapeHtml(fileName)}</small></div>`;
        };
        return card;
      }

      if (['opus', 'ogg', 'mp3', 'm4a', 'wav', 'aac'].includes(ext)) {
        const container = document.createElement("div");
        container.className = "voice-note-player";

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "voice-play-btn";
        playBtn.setAttribute("aria-label", "Play voice note");
        playBtn.textContent = "▶";

        const body = document.createElement("div");
        body.className = "voice-body";

        const track = document.createElement("div");
        track.className = "voice-track";
        const progress = document.createElement("div");
        progress.className = "voice-progress";
        track.appendChild(progress);

        const footer = document.createElement("div");
        footer.className = "voice-footer";
        const timeEl = document.createElement("span");
        timeEl.className = "voice-time";
        timeEl.textContent = "0:00";

        const fileLink = document.createElement("a");
        fileLink.className = "voice-file-link";
        fileLink.href = mediaUrl;
        fileLink.textContent = fileName;
        fileLink.title = fileName;
        if (typeof mediaIndexId === 'number' && appState.mediaIndex[mediaIndexId]) {
          fileLink.onclick = openModalHandler;
        } else {
          fileLink.target = "_blank";
        }

        footer.appendChild(timeEl);
        footer.appendChild(fileLink);
        body.appendChild(track);
        body.appendChild(footer);
        container.appendChild(playBtn);
        container.appendChild(body);

        playBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          globalVoiceController.play(mediaUrl, playBtn, progress, timeEl);
        });

        track.addEventListener("click", (e) => {
          e.stopPropagation();
          const rect = track.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const ratio = Math.max(0, Math.min(1, clickX / rect.width));
          if (globalVoiceController.currentUrl === mediaUrl && globalVoiceController.audio.duration) {
            globalVoiceController.audio.currentTime = ratio * globalVoiceController.audio.duration;
            progress.style.width = `${ratio * 100}%`;
          } else {
            globalVoiceController.play(mediaUrl, playBtn, progress, timeEl);
            globalVoiceController.audio.addEventListener("loadedmetadata", () => {
              if (globalVoiceController.currentUrl === mediaUrl && globalVoiceController.audio.duration) {
                globalVoiceController.audio.currentTime = ratio * globalVoiceController.audio.duration;
              }
            }, { once: true });
          }
        });

        return container;
      }

      const link = document.createElement("a");
      link.className = "file-attachment";
      link.href = mediaUrl;
      link.target = "_blank";
      link.innerHTML = `📎 ${highlightText(fileName, terms)}`;
      if (typeof mediaIndexId === 'number') {
        link.onclick = (e) => {
          e.preventDefault();
          openLightbox(mediaIndexId, null);
        };
      }
      return link;
    }

    function createMessageElement(item, terms) {
      if (item.type === "system") {
        const sysEl = document.createElement("div");
        sysEl.id = `msg-${item.id}`;
        sysEl.className = "system-message";
        sysEl.innerHTML = highlightText(item.text, terms);
        return sysEl;
      }

      const msgEl = document.createElement("div");
      msgEl.id = `msg-${item.id}`;
      const isUser = (item.sender && (item.sender.toLowerCase() === "you" || item.sender.toLowerCase() === "me"));
      msgEl.className = `message ${isUser ? "user" : "other"}`;

      if (!isUser) {
        const senderEl = document.createElement("div");
        senderEl.className = "sender-name";
        senderEl.innerHTML = highlightText(item.sender, terms);
        msgEl.appendChild(senderEl);
      }

      if (item.attachment) {
        const mediaNode = renderAttachment(item.attachment.fileName, terms, item.mediaIndexId);
        msgEl.appendChild(mediaNode);
        const caption = extractAttachment(item.text).cleanText;
        if (caption) {
          const captionEl = document.createElement("div");
          captionEl.className = "message-text";
          captionEl.innerHTML = highlightText(caption, terms);
          msgEl.appendChild(captionEl);
        }
      } else {
        const textEl = document.createElement("div");
        textEl.className = "message-text";
        textEl.innerHTML = highlightText(item.text.replace(/[\u200e\u200f]/g, ""), terms);
        msgEl.appendChild(textEl);
      }

      const metaEl = document.createElement("span");
      metaEl.className = "meta";
      metaEl.textContent = `${item.date} ${item.time}`;
      msgEl.appendChild(metaEl);

      return msgEl;
    }

    function renderEmptyState() {
      const emptyEl = document.createElement("div");
      emptyEl.className = "empty-search-state";
      emptyEl.innerHTML = `
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No messages found</div>
        <div class="empty-desc">Try changing search query or resetting filters</div>
      `;
      chatContainer.appendChild(emptyEl);
    }

    function renderNextBatch() {
      const activeDataset = appState.isSearchActive 
        ? appState.filteredMessages 
        : appState.allMessages;

      if (activeDataset.length === 0) {
        loadingIndicator.style.display = "none";
        if (appState.isSearchActive && chatContainer.children.length === 0) {
          renderEmptyState();
        }
        return;
      }

      if (appState.currentIndex >= activeDataset.length) {
        loadingIndicator.style.display = "none";
        return;
      }

      loadingIndicator.style.display = "block";
      const endIndex = Math.min(appState.currentIndex + chunkSize, activeDataset.length);
      const fragment = document.createDocumentFragment();

      const terms = appState.isSearchActive ? appState.normalizedTerms : [];
      for (let i = appState.currentIndex; i < endIndex; i++) {
        fragment.appendChild(createMessageElement(activeDataset[i], terms));
      }

      chatContainer.appendChild(fragment);
      appState.currentIndex = endIndex;
      loadingIndicator.style.display = appState.currentIndex >= activeDataset.length ? "none" : "block";
    }

    function updateScrollBottomButton() {
      if (appState.currentView !== "chat") {
        scrollToBottomBtn.classList.remove("visible");
        return;
      }
      const activeDataset = appState.isSearchActive ? appState.filteredMessages : appState.allMessages;
      const distanceToBottom = chatContainer.scrollHeight - (chatContainer.scrollTop + chatContainer.clientHeight);
      const hasUnrendered = appState.currentIndex < activeDataset.length;
      if (distanceToBottom > 350 || hasUnrendered) {
        scrollToBottomBtn.classList.add("visible");
      } else {
        scrollToBottomBtn.classList.remove("visible");
      }
    }

    chatContainer.addEventListener("scroll", function() {
      if (chatContainer.scrollTop + chatContainer.clientHeight >= chatContainer.scrollHeight - 100) {
        const activeDataset = appState.isSearchActive ? appState.filteredMessages : appState.allMessages;
        if (appState.currentIndex < activeDataset.length) {
          renderNextBatch();
        }
      }
      updateScrollBottomButton();
    });

    function scrollToBottom(options = {}) {
      const behavior = options.behavior || "smooth";
      const activeDataset = appState.isSearchActive ? appState.filteredMessages : appState.allMessages;
      if (activeDataset.length === 0) return;

      // If jumping to bottom from start or far behind, slice to the visible window (last ~100 messages)
      if (appState.currentIndex === 0 && activeDataset.length > 100) {
        chatContainer.innerHTML = "";
        appState.currentIndex = activeDataset.length - 100;
      }

      if (appState.currentIndex < activeDataset.length) {
        const terms = appState.isSearchActive ? appState.normalizedTerms : [];
        const remaining = activeDataset.length - appState.currentIndex;

        // If remaining is large, batch or render visible window
        if (remaining > 150) {
          chatContainer.innerHTML = "";
          appState.currentIndex = Math.max(0, activeDataset.length - 100);
        }

        const fragment = document.createDocumentFragment();
        for (let i = appState.currentIndex; i < activeDataset.length; i++) {
          fragment.appendChild(createMessageElement(activeDataset[i], terms));
        }
        chatContainer.appendChild(fragment);
        appState.currentIndex = activeDataset.length;
        loadingIndicator.style.display = "none";
      }

      requestAnimationFrame(() => {
        chatContainer.scrollTo({
          top: chatContainer.scrollHeight,
          behavior: behavior
        });
        setTimeout(updateScrollBottomButton, behavior === "smooth" ? 350 : 50);
      });
    }

    scrollToBottomBtn.addEventListener("click", scrollToBottom);

    function matchMessage(item, terms, filters) {
      if (filters.sender && filters.sender !== "ALL") {
        if (item.type === "system" || item.sender !== filters.sender) {
          return false;
        }
      }

      if (filters.mediaOnly) {
        if (!item.attachment) return false;
      }

      if (filters.dateFrom !== null && item.timestamp < filters.dateFrom) {
        return false;
      }
      if (filters.dateTo !== null && item.timestamp > filters.dateTo) {
        return false;
      }

      if (terms.length > 0) {
        const target = item._searchIndex;
        for (let i = 0; i < terms.length; i++) {
          if (!target.includes(terms[i])) {
            return false;
          }
        }
      }

      return true;
    }

    function updateSearchStats(count, total) {
      if (!appState.isSearchActive) {
        searchStats.textContent = "";
        return;
      }
      searchStats.innerHTML = `Found: <span class="highlight-count">${count.toLocaleString()}</span> of ${total.toLocaleString()}`;
    }

    function applySearchAndFilter() {
      const rawQuery = searchInput.value.trim();
      appState.searchQuery = rawQuery;
      searchClearBtn.style.display = rawQuery.length > 0 ? "block" : "none";

      const terms = rawQuery
        .toLowerCase()
        .split(/\s+/)
        .filter(t => t.length > 0);
      appState.normalizedTerms = terms;

      const dateFromVal = dateFromInput.value;
      const dateToVal = dateToInput.value;

      appState.filters.sender = senderFilter.value;
      appState.filters.dateFrom = dateFromVal ? new Date(dateFromVal + "T00:00:00").getTime() : null;
      appState.filters.dateTo = dateToVal ? new Date(dateToVal + "T23:59:59").getTime() : null;
      appState.filters.mediaOnly = mediaOnlyCheckbox.checked;

      const hasActiveFilters = appState.filters.sender !== "ALL" ||
        appState.filters.dateFrom !== null ||
        appState.filters.dateTo !== null ||
        appState.filters.mediaOnly;

      const wasActive = appState.isSearchActive;
      appState.isSearchActive = terms.length > 0 || hasActiveFilters;

      if (!wasActive && appState.isSearchActive) {
        appState.lastScrollTop = chatContainer.scrollTop;
      }

      if (appState.isSearchActive) {
        appState.filteredMessages = appState.allMessages.filter(item => 
          matchMessage(item, terms, appState.filters)
        );
        updateSearchStats(appState.filteredMessages.length, appState.allMessages.length);
      } else {
        appState.filteredMessages = [];
        updateSearchStats(0, appState.allMessages.length);
      }

      chatContainer.innerHTML = "";
      appState.currentIndex = 0;
      chatContainer.scrollTop = 0;
      renderNextBatch();

      if (!appState.isSearchActive && wasActive) {
        chatContainer.scrollTop = appState.lastScrollTop;
      }
      updateScrollBottomButton();
    }

    let debounceTimer = null;
    function debouncedSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applySearchAndFilter, 200);
    }

    searchInput.addEventListener("input", function() {
      searchClearBtn.style.display = searchInput.value.length > 0 ? "block" : "none";
      debouncedSearch();
    });

    searchClearBtn.addEventListener("click", function() {
      searchInput.value = "";
      searchClearBtn.style.display = "none";
      searchInput.focus();
      applySearchAndFilter();
    });

    senderFilter.addEventListener("change", applySearchAndFilter);
    dateFromInput.addEventListener("change", applySearchAndFilter);
    dateToInput.addEventListener("change", applySearchAndFilter);
    mediaOnlyCheckbox.addEventListener("change", applySearchAndFilter);

    resetFiltersBtn.addEventListener("click", function() {
      searchInput.value = "";
      searchClearBtn.style.display = "none";
      senderFilter.value = "ALL";
      dateFromInput.value = "";
      dateToInput.value = "";
      mediaOnlyCheckbox.checked = false;
      applySearchAndFilter();
    });

    // Keyboard Shortcuts
    document.addEventListener("keydown", function(e) {
      // Ctrl+F / Cmd+F: Focus search input
      if ((e.ctrlKey || e.metaKey) && (e.key === "f" || e.key === "F")) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
      // Escape: clear search input if active
      if (e.key === "Escape") {
        if (messageContextMenu && messageContextMenu.style.display === "block") {
          hideContextMenu();
          return;
        }
        if (searchInput === document.activeElement || searchInput.value.length > 0) {
          searchInput.value = "";
          searchClearBtn.style.display = "none";
          searchInput.blur();
          applySearchAndFilter();
        }
      }
      // End key: jump to bottom when viewing chat and not focused in input
      if (e.key === "End" && appState.currentView === "chat" && document.activeElement !== searchInput && document.activeElement !== gallerySearchInput) {
        e.preventDefault();
        scrollToBottom();
      }
    });

    // Message Context Menu Controller
    function hideContextMenu() {
      if (messageContextMenu) {
        messageContextMenu.style.display = "none";
        messageContextMenu.setAttribute("aria-hidden", "true");
        contextMenuTargetMessageId = null;
      }
    }

    chatContainer.addEventListener("contextmenu", function(e) {
      const msgEl = e.target.closest(".message, .system-message");
      if (!msgEl) {
        hideContextMenu();
        return;
      }

      const rawId = msgEl.id ? msgEl.id.replace("msg-", "") : null;
      if (!rawId) {
        hideContextMenu();
        return;
      }
      const messageId = parseInt(rawId, 10);
      if (isNaN(messageId)) {
        hideContextMenu();
        return;
      }

      e.preventDefault();
      contextMenuTargetMessageId = messageId;

      messageContextMenu.style.display = "block";
      messageContextMenu.setAttribute("aria-hidden", "false");

      const menuWidth = messageContextMenu.offsetWidth || 190;
      const menuHeight = messageContextMenu.offsetHeight || 44;
      const padding = 10;

      let posX = e.clientX;
      let posY = e.clientY;

      if (posX + menuWidth > window.innerWidth - padding) {
        posX = window.innerWidth - menuWidth - padding;
      }
      if (posY + menuHeight > window.innerHeight - padding) {
        posY = window.innerHeight - menuHeight - padding;
      }

      messageContextMenu.style.left = `${Math.max(padding, posX)}px`;
      messageContextMenu.style.top = `${Math.max(padding, posY)}px`;
    });

    contextMenuGoHistory.addEventListener("click", function() {
      if (contextMenuTargetMessageId !== null) {
        const targetId = contextMenuTargetMessageId;
        hideContextMenu();
        jumpToChatMessage(targetId, { resetSearch: true });
      }
    });

    document.addEventListener("click", function(e) {
      if (messageContextMenu && messageContextMenu.style.display === "block") {
        if (!messageContextMenu.contains(e.target)) {
          hideContextMenu();
        }
      }
    });

    chatContainer.addEventListener("scroll", hideContextMenu);
    window.addEventListener("resize", hideContextMenu);

    function populateSenderFilter(messages) {
      const senders = new Set();
      for (let i = 0; i < messages.length; i++) {
        if (messages[i].type === "message" && messages[i].sender) {
          senders.add(messages[i].sender);
        }
      }
      senderFilter.innerHTML = '<option value="ALL">All participants</option>';
      Array.from(senders).sort().forEach(sender => {
        const opt = document.createElement("option");
        opt.value = sender;
        opt.textContent = sender;
        senderFilter.appendChild(opt);
      });
    }

    function configureDateBounds(messages) {
      let minTs = Infinity;
      let maxTs = -Infinity;
      for (let i = 0; i < messages.length; i++) {
        const ts = messages[i].timestamp;
        if (ts > 0) {
          if (ts < minTs) minTs = ts;
          if (ts > maxTs) maxTs = ts;
        }
      }
      if (minTs !== Infinity && maxTs !== -Infinity) {
        const formatDateToLocalISO = (timestamp) => {
          const dateObj = new Date(timestamp);
          const yearStr = dateObj.getFullYear();
          const monthStr = String(dateObj.getMonth() + 1).padStart(2, "0");
          const dayStr = String(dateObj.getDate()).padStart(2, "0");
          return `${yearStr}-${monthStr}-${dayStr}`;
        };
        const minDateStr = formatDateToLocalISO(minTs);
        const maxDateStr = formatDateToLocalISO(maxTs);
        dateFromInput.min = minDateStr;
        dateFromInput.max = maxDateStr;
        dateToInput.min = minDateStr;
        dateToInput.max = maxDateStr;
      }
    }

    function parseChat(rawText) {
      const headerRegex = /^(\d{2}[./]\d{2}[./]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AaPp][Mm])?)\s*-\s*/gm;
      const starts = [];
      let match;
      while ((match = headerRegex.exec(rawText)) !== null) {
        starts.push({
          index: match.index,
          headerLength: match[0].length,
          date: match[1],
          time: match[2]
        });
      }

      const parsed = [];
      for (let i = 0; i < starts.length; i++) {
        const cur = starts[i];
        const nextIndex = (i + 1 < starts.length) ? starts[i + 1].index : rawText.length;
        const body = rawText.slice(cur.index + cur.headerLength, nextIndex).trim();
        const timestamp = parseDateToTimestamp(cur.date, cur.time);

        const senderMatch = body.match(/^([^:\n]+?):\s*([\s\S]*)$/);
        if (senderMatch) {
          const sender = senderMatch[1].trim();
          const rawMsgText = senderMatch[2];
          const { attachment, cleanText } = extractAttachment(rawMsgText);
          const searchTarget = `${sender} ${cleanText} ${attachment ? attachment.fileName : ''}`.toLowerCase();

          parsed.push({
            id: i,
            type: "message",
            date: cur.date,
            time: cur.time,
            timestamp,
            sender,
            text: rawMsgText,
            attachment,
            _searchIndex: searchTarget
          });
        } else {
          const { attachment, cleanText } = extractAttachment(body);
          const searchTarget = `${body} ${attachment ? attachment.fileName : ''}`.toLowerCase();
          parsed.push({
            id: i,
            type: "system",
            date: cur.date,
            time: cur.time,
            timestamp,
            sender: "",
            text: body,
            attachment,
            _searchIndex: searchTarget
          });
        }
      }
      // Build media index and link attachments to media items
      appState.mediaIndex = buildMediaIndex(parsed);
      return parsed;
    }

    // Lightbox Modal Controller
    function openLightbox(mediaIdOrIndex, customList = null) {
      let list = customList;
      let index = 0;

      if (!list) {
        list = appState.mediaIndex;
        index = list.findIndex(m => m.id === mediaIdOrIndex);
      } else {
        index = typeof mediaIdOrIndex === 'number' ? mediaIdOrIndex : 0;
      }

      if (index === -1 || !list[index]) return;

      lightboxState.isOpen = true;
      lightboxState.mediaList = list;
      lightboxState.currentIndex = index;
      lightboxState.zoomLevel = 1.0;
      lightboxState.panOffset = { x: 0, y: 0 };

      globalVoiceController.stop();
      lightboxModal.style.display = "flex";
      lightboxModal.setAttribute("aria-hidden", "false");
      renderLightboxMedia();
    }

    function closeLightbox() {
      if (!lightboxState.isOpen) return;
      lightboxState.isOpen = false;
      lightboxModal.style.display = "none";
      lightboxModal.setAttribute("aria-hidden", "true");
      stopLightboxAudio();
      lightboxViewport.innerHTML = "";
    }

    function stopLightboxAudio() {
      if (lightboxState.audioInstance) {
        lightboxState.audioInstance.pause();
        lightboxState.audioInstance = null;
      }
    }

    function showPrevMedia() {
      if (!lightboxState.isOpen || lightboxState.mediaList.length === 0) return;
      if (lightboxState.currentIndex > 0) {
        lightboxState.currentIndex--;
        lightboxState.zoomLevel = 1.0;
        lightboxState.panOffset = { x: 0, y: 0 };
        renderLightboxMedia();
      }
    }

    function showNextMedia() {
      if (!lightboxState.isOpen || lightboxState.mediaList.length === 0) return;
      if (lightboxState.currentIndex < lightboxState.mediaList.length - 1) {
        lightboxState.currentIndex++;
        lightboxState.zoomLevel = 1.0;
        lightboxState.panOffset = { x: 0, y: 0 };
        renderLightboxMedia();
      }
    }

    function renderLightboxMedia() {
      stopLightboxAudio();
      const item = lightboxState.mediaList[lightboxState.currentIndex];
      if (!item) return;

      lightboxTitle.textContent = item.fileName;
      lightboxSender.textContent = item.sender;
      lightboxCounter.textContent = `${lightboxState.currentIndex + 1} / ${lightboxState.mediaList.length}`;
      lightboxBtnDownload.href = item.fileUrl;
      lightboxBtnDownload.download = item.fileName;
      lightboxCaption.textContent = item.caption || "";
      lightboxCaption.style.display = item.caption ? "block" : "none";

      lightboxBtnPrev.style.visibility = lightboxState.currentIndex > 0 ? "visible" : "hidden";
      lightboxBtnNext.style.visibility = lightboxState.currentIndex < lightboxState.mediaList.length - 1 ? "visible" : "hidden";

      lightboxViewport.innerHTML = "";

      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.extension)) {
        const img = document.createElement("img");
        img.src = item.fileUrl;
        img.alt = item.fileName;
        applyImageTransform(img);

        // Wheel zoom
        img.addEventListener("wheel", (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8;
          lightboxState.zoomLevel = Math.min(4.0, Math.max(1.0, lightboxState.zoomLevel * zoomFactor));
          if (lightboxState.zoomLevel === 1.0) {
            lightboxState.panOffset = { x: 0, y: 0 };
          }
          applyImageTransform(img);
        }, { passive: false });

        // Double click reset
        img.addEventListener("dblclick", () => {
          lightboxState.zoomLevel = lightboxState.zoomLevel > 1.0 ? 1.0 : 2.0;
          lightboxState.panOffset = { x: 0, y: 0 };
          applyImageTransform(img);
        });

        // Drag to pan
        img.addEventListener("mousedown", (e) => {
          if (lightboxState.zoomLevel <= 1.0) return;
          lightboxState.isDragging = true;
          lightboxState.dragStart = { x: e.clientX - lightboxState.panOffset.x, y: e.clientY - lightboxState.panOffset.y };
          img.classList.add("panning");
        });

        img.onerror = () => {
          lightboxViewport.innerHTML = `<div class="missing-placeholder"><span>⚠️ File not found</span><small>${escapeHtml(item.fileName)}</small></div>`;
        };

        lightboxViewport.appendChild(img);
      } else if (['mp4', 'webm', 'mov'].includes(item.extension)) {
        const video = document.createElement("video");
        video.src = item.fileUrl;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.onerror = () => {
          lightboxViewport.innerHTML = `<div class="missing-placeholder"><span>⚠️ Video unavailable</span><small>${escapeHtml(item.fileName)}</small></div>`;
        };
        lightboxViewport.appendChild(video);
      } else if (['opus', 'ogg', 'mp3', 'm4a', 'wav', 'aac'].includes(item.extension)) {
        renderLightboxAudio(item);
      } else {
        // Document card
        const docCard = document.createElement("div");
        docCard.className = "lightbox-doc-card";
        docCard.innerHTML = `
          <div class="lightbox-doc-icon">📄</div>
          <div class="lightbox-doc-name">${escapeHtml(item.fileName)}</div>
          <div style="font-size: 0.85rem; color: #8696a0;">${item.sender} &bull; ${item.date} ${item.time}</div>
          <a class="lightbox-doc-download-btn" href="${item.fileUrl}" download="${escapeHtml(item.fileName)}">⬇ Open / Download file</a>
        `;
        lightboxViewport.appendChild(docCard);
      }
    }

    function applyImageTransform(img) {
      img.style.transform = `translate(${lightboxState.panOffset.x}px, ${lightboxState.panOffset.y}px) scale(${lightboxState.zoomLevel})`;
    }

    function renderLightboxAudio(item) {
      const card = document.createElement("div");
      card.className = "lightbox-audio-card";
      card.innerHTML = `
        <div class="lightbox-audio-meta">
          <div class="lightbox-audio-icon">🎙️</div>
          <div class="lightbox-audio-details">
            <div class="lightbox-audio-title">${escapeHtml(item.fileName)}</div>
            <div class="lightbox-audio-sub">${escapeHtml(item.sender)} &bull; ${item.date} ${item.time}</div>
          </div>
        </div>
        <div class="lightbox-audio-controls">
          <button class="lightbox-audio-play-btn" id="lightbox-audio-play">▶</button>
          <input type="range" class="lightbox-audio-seekbar" id="lightbox-audio-seek" value="0" min="0" max="100" step="0.1">
          <span class="lightbox-audio-time" id="lightbox-audio-time">0:00</span>
          <button class="lightbox-audio-speed-btn" id="lightbox-audio-speed">${lightboxState.audioPlaybackSpeed}x</button>
        </div>
        <div id="lightbox-audio-error-box" style="display: none;"></div>
      `;

      lightboxViewport.appendChild(card);

      const playBtn = card.querySelector("#lightbox-audio-play");
      const seekbar = card.querySelector("#lightbox-audio-seek");
      const timeSpan = card.querySelector("#lightbox-audio-time");
      const speedBtn = card.querySelector("#lightbox-audio-speed");
      const errorBox = card.querySelector("#lightbox-audio-error-box");

      const audio = new Audio();
      audio.src = item.fileUrl;
      audio.playbackRate = lightboxState.audioPlaybackSpeed;
      lightboxState.audioInstance = audio;

      function formatAudioTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      playBtn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play().catch(err => {
            errorBox.style.display = "block";
            errorBox.innerHTML = `<a class="audio-fallback-link" href="${item.fileUrl}" download>⚠️ Could not play .opus in browser. Download file</a>`;
          });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", () => {
        playBtn.textContent = "⏸";
      });

      audio.addEventListener("pause", () => {
        playBtn.textContent = "▶";
      });

      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        seekbar.value = (audio.currentTime / audio.duration) * 100;
        timeSpan.textContent = formatAudioTime(audio.currentTime);
      });

      audio.addEventListener("ended", () => {
        playBtn.textContent = "▶";
        seekbar.value = 0;
      });

      seekbar.addEventListener("input", () => {
        if (audio.duration) {
          audio.currentTime = (seekbar.value / 100) * audio.duration;
        }
      });

      speedBtn.addEventListener("click", () => {
        const speeds = [1.0, 1.5, 2.0];
        let curIdx = speeds.indexOf(lightboxState.audioPlaybackSpeed);
        curIdx = (curIdx + 1) % speeds.length;
        lightboxState.audioPlaybackSpeed = speeds[curIdx];
        audio.playbackRate = lightboxState.audioPlaybackSpeed;
        speedBtn.textContent = `${lightboxState.audioPlaybackSpeed}x`;
      });

      audio.addEventListener("error", () => {
        errorBox.style.display = "block";
        errorBox.innerHTML = `<a class="audio-fallback-link" href="${item.fileUrl}" download>⚠️ Could not play .opus in browser. Download file</a>`;
      });
    }

    // Jump to Chat Message Protocol
    function jumpToChatMessage(messageId, options = {}) {
      closeLightbox();
      // If resetSearch option is passed, or if target message is not in active search, reset search
      if (appState.isSearchActive && (options.resetSearch || !appState.filteredMessages.some(m => m.id === messageId))) {
        searchInput.value = "";
        searchClearBtn.style.display = "none";
        senderFilter.value = "ALL";
        dateFromInput.value = "";
        dateToInput.value = "";
        mediaOnlyCheckbox.checked = false;
        appState.isSearchActive = false;
        appState.filteredMessages = [];
        appState.normalizedTerms = [];
        updateSearchStats(0, appState.allMessages.length);
        chatContainer.innerHTML = "";
        appState.currentIndex = 0;
        renderNextBatch();
      }
      switchView("chat");

      // Ensure target message is rendered
      const activeDataset = appState.isSearchActive ? appState.filteredMessages : appState.allMessages;
      const targetIndexInActive = activeDataset.findIndex(m => m.id === messageId);
      if (targetIndexInActive !== -1 && targetIndexInActive >= appState.currentIndex) {
        const targetChunkEnd = Math.min(activeDataset.length, Math.ceil((targetIndexInActive + 1) / chunkSize) * chunkSize);

        const fragment = document.createDocumentFragment();
        const terms = appState.isSearchActive ? appState.normalizedTerms : [];
        for (let i = appState.currentIndex; i < targetChunkEnd; i++) {
          fragment.appendChild(createMessageElement(activeDataset[i], terms));
        }
        chatContainer.appendChild(fragment);
        appState.currentIndex = targetChunkEnd;
        loadingIndicator.style.display = appState.currentIndex >= activeDataset.length ? "none" : "block";
      }
      // Wait for layout reflow and scroll to target
      requestAnimationFrame(() => {
        const el = document.getElementById(`msg-${messageId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'auto', block: 'center' });
          el.classList.add('highlight-pulse');
          setTimeout(() => el.classList.remove('highlight-pulse'), 2500);

          // If the message has an unloaded image, re-align once loaded to prevent height-shift drift
          const img = el.querySelector("img.media-preview");
          if (img && !img.complete) {
            img.addEventListener("load", () => {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, { once: true });
          }
        }
      });
    }

    // Gallery Controller & Batch Rendering
    const galleryChunkSize = 60;
    let galleryObserver = null;

    function initGalleryObserver() {
      if (galleryObserver) galleryObserver.disconnect();
      galleryObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && appState.currentView === "media") {
          if (appState.galleryCurrentIndex < appState.filteredMedia.length) {
            renderNextGalleryBatch();
          }
        }
      }, { rootMargin: '400px' });
      galleryObserver.observe(gallerySentinel);
    }

    function filterGalleryMedia() {
      let list = appState.mediaIndex;
      if (appState.galleryCategory !== "all") {
        list = list.filter(m => m.fileType === appState.galleryCategory);
      }
      if (appState.gallerySearchQuery) {
        const q = appState.gallerySearchQuery.toLowerCase();
        list = list.filter(m => 
          m.fileName.toLowerCase().includes(q) || 
          m.caption.toLowerCase().includes(q) ||
          m.sender.toLowerCase().includes(q)
        );
      }
      appState.filteredMedia = list;
      appState.galleryCurrentIndex = 0;
      galleryGrid.innerHTML = "";
      renderNextGalleryBatch();
    }

    function updateGalleryCounts() {
      const total = appState.mediaIndex.length;
      totalMediaCountSpan.textContent = total.toLocaleString();
      countAllSpan.textContent = total.toLocaleString();

      const photoVideoCount = appState.mediaIndex.filter(m => m.fileType === "photo_video").length;
      const voiceCount = appState.mediaIndex.filter(m => m.fileType === "voice").length;
      const docCount = appState.mediaIndex.filter(m => m.fileType === "document").length;

      countPhotoVideoSpan.textContent = photoVideoCount.toLocaleString();
      countVoiceSpan.textContent = voiceCount.toLocaleString();
      countDocSpan.textContent = docCount.toLocaleString();
    }

    function renderNextGalleryBatch() {
      const activeList = appState.filteredMedia;
      if (activeList.length === 0) {
        galleryLoadingIndicator.style.display = "none";
        if (galleryGrid.children.length === 0) {
          galleryGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #667781; padding: 40px;">No media files found</div>`;
        }
        return;
      }

      if (appState.galleryCurrentIndex >= activeList.length) {
        galleryLoadingIndicator.style.display = "none";
        return;
      }

      galleryLoadingIndicator.style.display = "block";
      const endIndex = Math.min(appState.galleryCurrentIndex + galleryChunkSize, activeList.length);
      const fragment = document.createDocumentFragment();

      for (let i = appState.galleryCurrentIndex; i < endIndex; i++) {
        fragment.appendChild(createGalleryCard(activeList[i], i));
      }

      galleryGrid.appendChild(fragment);
      appState.galleryCurrentIndex = endIndex;
      galleryLoadingIndicator.style.display = appState.galleryCurrentIndex >= activeList.length ? "none" : "block";
    }

    function createGalleryCard(item, filteredIndex) {
      const card = document.createElement("div");
      card.className = "gallery-card";

      card.onclick = () => {
        openLightbox(filteredIndex, appState.filteredMedia);
      };

      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(item.extension)) {
        const img = document.createElement("img");
        img.src = item.fileUrl;
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = item.fileName;
        img.onerror = () => {
          card.innerHTML = `<div class="missing-placeholder"><span>⚠️ File not found</span><small>${escapeHtml(item.fileName)}</small></div>`;
        };
        card.appendChild(img);
      } else if (['mp4', 'webm', 'mov'].includes(item.extension)) {
        const video = document.createElement("video");
        video.src = item.fileUrl;
        video.preload = "none";
        card.appendChild(video);

        const badge = document.createElement("div");
        badge.className = "gallery-badge-video";
        badge.innerHTML = "▶ Video";
        card.appendChild(badge);
      } else if (item.fileType === "voice") {
        card.className += " gallery-card-voice";
        card.innerHTML = `
          <div class="gallery-card-icon">🎙️</div>
          <div class="gallery-card-title">${escapeHtml(item.fileName)}</div>
          <button class="gallery-card-play-btn">▶ Listen</button>
          <div class="gallery-card-meta">
            <span>${escapeHtml(item.sender)}</span>
            <span>${item.date}</span>
          </div>
        `;
      } else {
        // Document
        card.className += " gallery-card-doc";
        card.innerHTML = `
          <div class="gallery-card-icon">📄</div>
          <div class="gallery-card-title">${escapeHtml(item.fileName)}</div>
          <div class="gallery-card-meta">
            <span>${item.extension.toUpperCase()}</span>
            <span>${item.date}</span>
          </div>
        `;
      }

      return card;
    }

    // View Switching
    function switchView(targetView) {
      appState.currentView = targetView;
      if (targetView === "chat") {
        viewTabChat.classList.add("active");
        viewTabMedia.classList.remove("active");
        chatContainer.style.display = "flex";
        searchPanel.style.display = "flex";
        mediaGalleryContainer.style.display = "none";
        loadingIndicator.style.display = appState.currentIndex >= (appState.isSearchActive ? appState.filteredMessages.length : appState.allMessages.length) ? "none" : "block";
      } else {
        viewTabMedia.classList.add("active");
        viewTabChat.classList.remove("active");
        chatContainer.style.display = "none";
        searchPanel.style.display = "none";
        loadingIndicator.style.display = "none";
        mediaGalleryContainer.style.display = "flex";
        filterGalleryMedia();
      }
      updateScrollBottomButton();
    }

    function initChatDataset(messages, countStatus) {
      appState.allMessages = messages;
      appState.filteredMessages = [];
      appState.isSearchActive = false;
      appState.currentIndex = 0;
      chatContainer.innerHTML = "";
      statusSpan.textContent = countStatus;
      populateSenderFilter(messages);
      configureDateBounds(messages);
      updateGalleryCounts();
      initGalleryObserver();
      renderNextBatch();
      scrollToBottom({ behavior: 'auto' });
    }

    // Event Listeners: View Switching
    viewTabChat.addEventListener("click", () => switchView("chat"));
    viewTabMedia.addEventListener("click", () => switchView("media"));

    // Event Listeners: Gallery Tabs and Search
    galleryTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        galleryTabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        appState.galleryCategory = tab.dataset.filter || "all";
        filterGalleryMedia();
      });
    });

    gallerySearchInput.addEventListener("input", () => {
      appState.gallerySearchQuery = gallerySearchInput.value.trim();
      filterGalleryMedia();
    });

    // Event Listeners: Lightbox Controls
    lightboxBtnClose.addEventListener("click", closeLightbox);
    lightboxOverlay.addEventListener("click", closeLightbox);
    lightboxBtnPrev.addEventListener("click", showPrevMedia);
    lightboxBtnNext.addEventListener("click", showNextMedia);

    lightboxBtnJump.addEventListener("click", () => {
      const item = lightboxState.mediaList[lightboxState.currentIndex];
      if (item && typeof item.messageId === 'number') {
        jumpToChatMessage(item.messageId);
      }
    });
    // Global drag handlers for lightbox image pan
    window.addEventListener("mousemove", (e) => {
      if (!lightboxState.isDragging) return;
      const img = lightboxViewport.querySelector("img");
      if (!img) return;
      lightboxState.panOffset = {
        x: e.clientX - lightboxState.dragStart.x,
        y: e.clientY - lightboxState.dragStart.y
      };
      applyImageTransform(img);
    });

    window.addEventListener("mouseup", () => {
      if (lightboxState.isDragging) {
        lightboxState.isDragging = false;
        const img = lightboxViewport.querySelector("img");
        if (img) img.classList.remove("panning");
      }
    });


    // Keyboard navigation
    window.addEventListener("keydown", (e) => {
      if (lightboxState.isOpen) {
        if (e.key === "Escape") {
          e.preventDefault();
          closeLightbox();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          showPrevMedia();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          showNextMedia();
        } else if (e.key === " ") {
          if (lightboxState.audioInstance) {
            e.preventDefault();
            const audio = lightboxState.audioInstance;
            if (audio.paused) audio.play();
            else audio.pause();
          } else {
            const video = lightboxViewport.querySelector("video");
            if (video) {
              e.preventDefault();
              if (video.paused) video.play();
              else video.pause();
            }
          }
        }
      }
    });
    function clearMediaMap() {
      if (appState.mediaFileMap && appState.mediaFileMap.size > 0) {
        for (const url of appState.mediaFileMap.values()) {
          try { URL.revokeObjectURL(url); } catch (_) {}
        }
        appState.mediaFileMap.clear();
      }
      appState.dirHandle = null;
    }

    async function openFolderPicker() {
      if ('showDirectoryPicker' in window) {
        try {
          const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
          clearMediaMap();
          appState.dirHandle = dirHandle;
          statusSpan.textContent = "Scanning folder...";

          let chatHandle = null;
          const fileEntries = [];

          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file') {
              if (!chatHandle && entry.name === '_chat.txt') {
                chatHandle = entry;
              } else if (!chatHandle && entry.name.toLowerCase().endsWith('.txt')) {
                chatHandle = entry;
              } else {
                fileEntries.push(entry);
              }
            }
          }

          if (!chatHandle) {
            statusSpan.textContent = "Error: No .txt chat file found in folder";
            return;
          }

          statusSpan.textContent = `Indexing ${fileEntries.length} media files...`;
          let mediaCount = 0;
          for (const entry of fileEntries) {
            try {
              const file = await entry.getFile();
              appState.mediaFileMap.set(entry.name, createMediaBlobUrl(file));
              mediaCount++;
            } catch (_) {}
          }

          statusSpan.textContent = `Reading ${chatHandle.name}...`;
          const chatFile = await chatHandle.getFile();
          const text = await chatFile.text();
          const parsed = parseChat(text);
          const statusMsg = mediaCount > 0
            ? `💬 ${parsed.length.toLocaleString()} messages & 🖼️ ${mediaCount.toLocaleString()} media files`
            : `💬 ${parsed.length.toLocaleString()} messages (text only)`;
          initChatDataset(parsed, statusMsg);
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.warn("showDirectoryPicker failed, falling back to input:", err);
          const folderInput = document.getElementById('folderInput');
          if (folderInput) folderInput.click();
        }
      } else {
        const folderInput = document.getElementById('folderInput');
        if (folderInput) folderInput.click();
      }
    }

    function processFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      const files = Array.from(fileList);

      clearMediaMap();

      // Find chat .txt file
      let chatFile = files.find(f => f.name === "_chat.txt");
      if (!chatFile) {
        chatFile = files.find(f => f.name.toLowerCase().endsWith(".txt"));
      }

      if (!chatFile) {
        statusSpan.textContent = "Error: No .txt chat file found in selection";
        return;
      }

      // Register media files into map
      let mediaCount = 0;
      for (const f of files) {
        if (f === chatFile) continue;
        // Index by filename
        appState.mediaFileMap.set(f.name, createMediaBlobUrl(f));
        mediaCount++;
      }

      statusSpan.textContent = `Reading ${chatFile.name}...`;
      const reader = new FileReader();
      reader.onload = function(e) {
        const parsed = parseChat(e.target.result);
        const statusMsg = mediaCount > 0
          ? `💬 ${parsed.length.toLocaleString()} messages & 🖼️ ${mediaCount.toLocaleString()} media files`
          : `💬 ${parsed.length.toLocaleString()} messages (text only)`;
        initChatDataset(parsed, statusMsg);
      };
      reader.readAsText(chatFile, "UTF-8");
    }

    const btnOpenFolder = document.getElementById('btnOpenFolder');
    if (btnOpenFolder) {
      btnOpenFolder.addEventListener('click', () => openFolderPicker());
    }

    const btnOpenFile = document.getElementById('btnOpenFile');
    if (btnOpenFile) {
      btnOpenFile.addEventListener('click', () => {
        const fileInput = document.getElementById('fileInput');
        if (fileInput) fileInput.click();
      });
    }

    const privacyBadge = document.getElementById('privacyBadge');
    if (privacyBadge) {
      privacyBadge.addEventListener('click', () => {
        alert("🔒 100% Client-Side Privacy\n\nAll files are processed entirely in your browser on your device.\nNo data, messages, or media are ever uploaded to any server or network.");
      });
    }

    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
      fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;
        processFiles([file]);
      });
    }

    const folderInput = document.getElementById('folderInput');
    if (folderInput) {
      folderInput.addEventListener('change', function(event) {
        if (event.target.files && event.target.files.length > 0) {
          processFiles(event.target.files);
        }
      });
    }

    // Drag and drop support
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', function(e) {
      e.preventDefault();
      dragCounter++;
      if (dropOverlay) dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', function(e) {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        if (dropOverlay) dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
    });

    window.addEventListener('drop', function(e) {
      e.preventDefault();
      dragCounter = 0;
      if (dropOverlay) dropOverlay.classList.remove('active');

      const dt = e.dataTransfer;
      if (!dt) return;

      if (dt.items && dt.items.length > 0 && typeof dt.items[0].webkitGetAsEntry === "function") {
        const entries = [];
        for (let i = 0; i < dt.items.length; i++) {
          const entry = dt.items[i].webkitGetAsEntry();
          if (entry) entries.push(entry);
        }
        if (entries.length > 0) {
          readAllEntries(entries).then(files => {
            if (files.length > 0) processFiles(files);
          }).catch(() => {
            if (dt.files && dt.files.length > 0) processFiles(dt.files);
          });
          return;
        }
      }

      if (dt.files && dt.files.length > 0) {
        processFiles(dt.files);
      }
    });

    // Recursively read FileSystemEntries from dropped folder
    async function readAllEntries(entries) {
      const files = [];
      async function traverse(entry) {
        if (entry.isFile) {
          const file = await new Promise((res, rej) => entry.file(res, rej));
          files.push(file);
        } else if (entry.isDirectory) {
          const dirReader = entry.createReader();
          const readBatch = () => new Promise((res, rej) => dirReader.readEntries(res, rej));
          let batch;
          do {
            batch = await readBatch();
            for (const child of batch) {
              await traverse(child);
            }
          } while (batch && batch.length > 0);
        }
      }
      for (const entry of entries) {
        await traverse(entry);
      }
      return files;
    }

    // Auto-load default chat file if served or accessible via relative fetch
    const defaultChatFile = "";
    if (defaultChatFile) {
      fetch(encodeURI(defaultChatFile))
        .then(res => {
          if (!res.ok) throw new Error("Fetch failed");
          return res.text();
        })
        .then(text => {
          const parsed = parseChat(text);
          initChatDataset(parsed, `Loaded: ${parsed.length.toLocaleString()} messages`);
        })
        .catch(() => {
          // Normal when opened via direct file:// protocol in browser without CORS
        });
    }
  </script>
